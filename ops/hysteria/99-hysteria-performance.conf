# Hysteria 2 uses QUIC over UDP. The Linux defaults (typically 208 KiB) are
# too small for sustained high-bandwidth, high-latency connections.
# Values follow the official Hysteria 2 Linux performance guidance.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Give short UDP bursts more room before the kernel starts dropping packets.
net.core.netdev_max_backlog = 4096
