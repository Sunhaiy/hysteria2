name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hysteria2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret
      SETTINGS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      QUOTA_DATABASE_TEST: '1'
      QUOTA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test
      AUTH_TELEMETRY_DATABASE_TEST: '1'
      AUTH_TELEMETRY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test
      NODE_SYNC_DATABASE_TEST: '1'
      NODE_SYNC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: ops/xray-agent/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hysteria/api prisma:generate
      - run: pnpm --filter @hysteria/api exec prisma migrate deploy
      - run: pnpm --filter @hysteria/api exec prisma migrate status
      - run: pnpm --filter @hysteria/api prisma:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify retired updater removal and migration staging
        env:
          RETIREMENT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test
        run: |
          python3 ops/xray-agent/remove_agent_updater_test.py
          node --test ops/release/staged-migrations.test.mjs
          node --test apps/api/prisma/remove-agent-updates-migration.test.js
      - name: Verify traffic billing against isolated schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test?schema=billing_test
          BILLING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test?schema=billing_test
        run: |
          pnpm --filter @hysteria/api exec prisma db push --skip-generate
          pnpm --filter @hysteria/api test:billing
      - name: Verify acknowledgement recovery against isolated schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test?schema=traffic_ack_test
          TRAFFIC_ACK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hysteria2_test?schema=traffic_ack_test
        run: |
          pnpm --filter @hysteria/api exec prisma db push --skip-generate
          pnpm --filter @hysteria/api test:traffic-ack
      - name: Verify HTTP and dedicated-database scenarios
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seo_brief_test
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE seo_brief_test'
          pnpm --filter @hysteria/api exec prisma migrate deploy
          pnpm --filter @hysteria/api prisma:seed
          pnpm --filter @hysteria/api test:e2e --runInBand
      - run: pnpm build
      - name: Package Linux release artifact
        run: |
          tar \
            --exclude-vcs \
            --exclude='./node_modules' \
            --exclude='./apps/api/node_modules' \
            --exclude='./apps/web/node_modules' \
            --exclude='./apps/web/.next/cache' \
            -czf "$RUNNER_TEMP/hysteria2-release-${GITHUB_SHA}.tar.gz" .
      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hysteria2-release
          path: ${{ runner.temp }}/hysteria2-release-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - run: go test ./...
        working-directory: ops/xray-agent
      - run: go test ./...
        working-directory: ops/destination-agent
      - name: Build Linux node Agent binaries
        working-directory: ops/xray-agent
        run: |
          mkdir -p "$RUNNER_TEMP/node-agents"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/node-agents/xray-agent-linux-amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/node-agents/xray-agent-linux-arm64" .
          cd "$RUNNER_TEMP/node-agents"
          sha256sum xray-agent-linux-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: node-agents
          path: ${{ runner.temp }}/node-agents/
          if-no-files-found: error
          retention-days: 7
